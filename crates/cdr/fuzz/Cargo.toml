[package]
name = "vectorcraft-cdr-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
vectorcraft-cdr = { path = "..", features = ["synth"] }

[[bin]]
name = "container"
path = "fuzz_targets/container.rs"
test = false
doc = false
bench = false

[[bin]]
name = "riff"
path = "fuzz_targets/riff.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
